<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Workshop Participant Console</title>
  <script src="/socket.io/socket.io.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .glass { background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); }
    .page-bg { background-color: #0b0f19; }
  </style>
</head>
<body class="page-bg text-slate-100 min-h-screen flex flex-col justify-between selection:bg-indigo-600 selection:text-white pb-10">

  <!-- Header -->
  <header class="p-4 border-b border-white/10 flex items-center justify-between sticky top-0 bg-black/60 backdrop-blur-md z-50">
    <div class="flex items-center space-x-2.5">
      <span class="inline-block w-2 h-2 rounded-full bg-emerald-400"></span>
      <span class="text-xs uppercase font-mono font-bold tracking-wider text-slate-300">Slide <span id="currentSlideNum">1</span> / 15</span>
    </div>

    <!-- Language selector -->
    <div class="flex items-center space-x-1.5">
      <span class="text-xs text-slate-400 font-mono">LANG:</span>
      <select id="langSelect" class="bg-slate-900 text-xs font-medium text-white px-2 py-1 rounded border border-white/20 focus:outline-none focus:ring-1 focus:ring-indigo-400">
        <option value="en">English</option>
        <option value="de">Deutsch</option>
        <option value="es">Español</option>
        <option value="fr">Français</option>
      </select>
    </div>
  </header>

  <!-- Main container -->
  <main class="flex-1 p-4 max-w-lg w-full mx-auto flex flex-col justify-center">

    <!-- Header card for current slide -->
    <div class="glass border border-white/10 rounded-xl p-5 mb-4 shadow-xl transition-all duration-300">
      <div id="slideBadge" class="text-[10px] font-mono uppercase tracking-widest text-indigo-400 mb-1">Live Presentation Module</div>
      <h1 id="slideTitle" class="text-lg font-bold text-white tracking-tight leading-snug">Connecting to session...</h1>
      <p id="slideSubtitle" class="text-xs text-slate-300 mt-1 leading-relaxed"></p>
      <div id="slideQuote" class="hidden mt-3 p-3 bg-white/5 border-l-2 border-indigo-400 italic text-xs text-slate-200 rounded-r"></div>
    </div>

    <!-- Dynamic interaction card -->
    <div id="interactionZone" class="glass border border-white/10 rounded-xl p-5 shadow-xl transition-all">
      <p class="text-center text-xs text-slate-400 py-6">Connecting to presentation server...</p>
    </div>

    <!-- Status feedback -->
    <div id="statusToast" class="opacity-0 transition-opacity duration-200 mt-4 text-center text-xs text-emerald-300 font-mono py-1 px-3 bg-emerald-950/80 border border-emerald-500/40 rounded-md mx-auto max-w-xs">
      Response submitted
    </div>

  </main>

  <!-- Footer -->
  <footer class="p-3 text-center border-t border-white/10 text-[11px] text-slate-400 font-mono">
    <span>Active Participants: </span><span id="onlineCount" class="font-bold text-indigo-300">0</span>
  </footer>

  <script>
    // Explicitly identify socket as an audience client
    const socket = io({
      query: { role: 'audience' }
    });

    let currentLang = 'en';
    let appState = null;

    const currentSlideNumEl = document.getElementById('currentSlideNum');
    const langSelect = document.getElementById('langSelect');
    const slideTitleEl = document.getElementById('slideTitle');
    const slideSubtitleEl = document.getElementById('slideSubtitle');
    const slideQuoteEl = document.getElementById('slideQuote');
    const interactionZone = document.getElementById('interactionZone');
    const onlineCountEl = document.getElementById('onlineCount');
    const statusToast = document.getElementById('statusToast');

    function showToast(msg = 'Response recorded') {
      statusToast.innerText = msg;
      statusToast.classList.remove('opacity-0');
      setTimeout(() => statusToast.classList.add('opacity-0'), 2000);
    }

    langSelect.addEventListener('change', (e) => {
      currentLang = e.target.value;
      renderCurrentSlide();
    });

    socket.on('participantCount', (count) => {
      onlineCountEl.innerText = count;
    });

    socket.on('syncState', (state) => {
      appState = state;
      onlineCountEl.innerText = state.participants;
      renderCurrentSlide();
    });

    socket.on('slideChanged', (data) => {
      if (appState) {
        appState.currentSlide = data.currentSlide;
      }
      renderCurrentSlide();
    });

    function getTranslation(slideNum) {
      if (!appState || !appState.translations) return null;
      const langPack = appState.translations[currentLang] || appState.translations['en'];
      return langPack ? langPack[slideNum] : null;
    }

    function renderCurrentSlide() {
      if (!appState) return;
      const slide = appState.currentSlide || 1;
      currentSlideNumEl.innerText = slide;

      const trans = getTranslation(slide) || {};
      slideTitleEl.innerText = trans.title || `Slide ${slide}`;
      slideSubtitleEl.innerText = trans.subtitle || '';

      if (trans.quote) {
        slideQuoteEl.innerText = trans.quote;
        slideQuoteEl.classList.remove('hidden');
      } else {
        slideQuoteEl.classList.add('hidden');
      }

      renderSlideInteractiveUI(slide, trans);
    }

    function renderSlideInteractiveUI(slide, trans) {
      // Slide 1: Welcome
      if (slide === 1) {
        interactionZone.innerHTML = `
          <div class="py-3 space-y-2 text-left">
            <div class="text-xs font-mono uppercase text-emerald-400 font-bold">Console Active</div>
            <p class="text-xs text-slate-300 leading-relaxed">
              Your device is connected to the session. As the presenter navigates through the slides, this console will automatically update with survey questions, empirical notes, and response forms.
            </p>
            <div class="p-2.5 bg-white/5 rounded border border-white/10 text-[11px] text-slate-400">
              Select language using the menu at the top right at any time.
            </div>
          </div>
        `;
      }
      // Slide 2: Predict Screen Time
      else if (slide === 2) {
        interactionZone.innerHTML = `
          <div class="space-y-4">
            <div>
              <label class="block text-xs font-semibold text-slate-200 mb-1.5">${trans.prompt1 || 'Primary Application Estimate:'}</label>
              <div class="grid grid-cols-2 gap-2">
                ${['Instagram', 'TikTok', 'YouTube', 'X / Twitter', 'Reddit', 'Snapchat'].map(app => `
                  <button onclick="voteApp('${app}')" class="p-2.5 rounded-lg bg-white/5 hover:bg-indigo-600/50 border border-white/10 text-xs font-medium text-left transition">
                    ${app}
                  </button>
                `).join('')}
              </div>
            </div>

            <div class="pt-3 border-t border-white/10">
              <label class="block text-xs font-semibold text-slate-200 mb-1.5">${trans.prompt2 || 'Estimation Accuracy (after verification):'}</label>
              <div class="grid grid-cols-2 gap-2">
                <button onclick="voteAccuracy('accurate')" class="p-2.5 rounded-lg bg-emerald-950/40 hover:bg-emerald-900/60 border border-emerald-500/40 text-xs font-medium text-left text-emerald-200">Accurate (within 15m)</button>
                <button onclick="voteAccuracy('under1h')" class="p-2.5 rounded-lg bg-white/5 hover:bg-white/10 border border-white/10 text-xs font-medium text-left">&lt; 1 hour disparity</button>
                <button onclick="voteAccuracy('oneToTwoH')" class="p-2.5 rounded-lg bg-white/5 hover:bg-white/10 border border-white/10 text-xs font-medium text-left">1-2 hours disparity</button>
                <button onclick="voteAccuracy('over2h')" class="p-2.5 rounded-lg bg-rose-950/40 hover:bg-rose-900/60 border border-rose-500/40 text-xs font-medium text-left text-rose-200">&gt; 2 hours disparity</button>
              </div>
            </div>
          </div>
        `;
      }
      // Slide 3: Screen time brackets
      else if (slide === 3) {
        const brackets = ['<2 h', '2-3 h', '3-4 h', '4-5 h', '5-6 h', '6-8 h', '8 h+'];
        interactionZone.innerHTML = `
          <div class="space-y-2">
            <p class="text-xs text-slate-300 font-medium">${trans.prompt || 'Total screen time recorded yesterday:'}</p>
            <div class="grid grid-cols-1 gap-1.5">
              ${brackets.map(b => `
                <button onclick="voteScreenTime('${b}')" class="w-full text-left px-3.5 py-2.5 rounded-lg bg-white/5 hover:bg-indigo-600/50 border border-white/10 text-xs font-medium flex items-center justify-between transition">
                  <span>${b}</span>
                  <span class="text-[10px] font-mono text-slate-400">Select</span>
                </button>
              `).join('')}
            </div>
          </div>
        `;
      }
      // Slide 4: Reclaimed time allocation
      else if (slide === 4) {
        const standardOptions = ['Sleep', 'Study / Deep Work', 'Physical Exercise', 'In-Person Socializing', 'Reading Books', 'Focused Hobby', 'Unstructured Rest'];
        interactionZone.innerHTML = `
          <div class="space-y-3">
            <label class="block text-xs font-medium text-slate-200 leading-snug">${trans.prompt || 'Preferred allocation of 30 reclaimed minutes:'}</label>
            <div class="flex flex-wrap gap-1.5">
              ${standardOptions.map(p => `
                <button onclick="submitTextWorth('${p}')" class="px-3 py-1.5 rounded-lg bg-white/5 hover:bg-indigo-600/50 text-xs font-medium border border-white/10">
                  ${p}
                </button>
              `).join('')}
            </div>
            <div class="flex gap-2 pt-2">
              <input id="timeWorthInput" type="text" placeholder="Custom allocation category..." class="flex-1 px-3 py-2 text-xs rounded-lg bg-black/40 border border-white/20 text-white focus:outline-none focus:ring-1 focus:ring-indigo-400" />
              <button onclick="submitCustomWorth()" class="px-4 py-2 text-xs font-bold rounded-lg bg-indigo-600 hover:bg-indigo-500 text-white">Submit</button>
            </div>
          </div>
        `;
      }
      // Slide 5: Research priors
      else if (slide === 5) {
        interactionZone.innerHTML = `
          <div class="space-y-4">
            <div>
              <p class="text-xs font-semibold text-slate-200 mb-2">${trans.prompt1 || 'Hypothesized strongest correlate:'}</p>
              <div class="grid grid-cols-2 gap-1.5">
                ${['IQ', 'Attention', 'Sleep', 'Anxiety / Depression', 'Academic Performance', 'Nothing Meaningful'].map(opt => `
                  <button onclick="voteEvidenceMetric('${opt}')" class="p-2.5 rounded-lg bg-white/5 hover:bg-indigo-600/50 border border-white/10 text-xs font-medium text-left">
                    ${opt}
                  </button>
                `).join('')}
              </div>
            </div>
            <div class="pt-3 border-t border-white/10">
              <p class="text-xs font-semibold text-slate-200 mb-2">${trans.prompt2 || 'Most convincing evidence standard:'}</p>
              <div class="grid grid-cols-2 gap-1.5">
                ${['One Large Survey', 'Longitudinal Study', 'Randomized Experiment (RCT)', 'Meta-Analysis'].map(opt => `
                  <button onclick="voteStudyType('${opt}')" class="p-2.5 rounded-lg bg-white/5 hover:bg-indigo-600/50 border border-white/10 text-xs font-medium text-left">
                    ${opt}
                  </button>
                `).join('')}
              </div>
            </div>
          </div>
        `;
      }
      // Slide 6, 7, 8, 10: Study insight cards
      else if ([6, 7, 8, 10].includes(slide)) {
        interactionZone.innerHTML = `
          <div class="space-y-3 py-1 text-left">
            <div class="text-[11px] font-mono text-indigo-400 uppercase font-bold tracking-wider">
              Research Synthesis Reference
            </div>
            <div class="p-3.5 rounded-lg bg-white/5 border border-white/10 text-xs leading-relaxed text-slate-200 space-y-2">
              <p class="font-medium text-white">${trans.takeaway || ''}</p>
              <p class="text-[11px] text-slate-400">Refer to the primary display for meta-analytic effect sizes and methodology notes.</p>
            </div>
          </div>
        `;
      }
      // Slide 9: Reallocation
      else if (slide === 9) {
        const cats = ['Another Screen', 'Studying', 'Exercise', 'Face-to-Face Socializing', 'Sleep', 'Outdoors', 'Nothing'];
        interactionZone.innerHTML = `
          <div class="space-y-2">
            <p class="text-xs font-semibold text-slate-200">${trans.prompt || 'Predicted primary reallocation of phone-free hours:'}</p>
            <div class="grid grid-cols-1 gap-1.5">
              ${cats.map(c => `
                <button onclick="voteTimeGo('${c}')" class="px-3.5 py-2.5 rounded-lg bg-white/5 hover:bg-indigo-600/50 border border-white/10 text-xs font-medium text-left flex justify-between">
                  <span>${c}</span>
                  <span class="text-slate-400 text-[10px] font-mono">Vote</span>
                </button>
              `).join('')}
            </div>
          </div>
        `;
      }
      // Slide 11: Behavioral Triggers
      else if (slide === 11) {
        const trigList = [
          'Immediately after waking',
          'Before sleep',
          'While studying / working',
          'When bored',
          'When stressed',
          'After a notification',
          'While waiting in queue',
          'Without conscious decision'
        ];
        interactionZone.innerHTML = `
          <div class="space-y-2">
            <p class="text-xs font-semibold text-slate-200">${trans.prompt || 'Primary trigger for automatic device access:'}</p>
            <div class="grid grid-cols-1 gap-1.5">
              ${trigList.map(t => `
                <button onclick="voteTrigger('${t}')" class="px-3.5 py-2.5 rounded-lg bg-white/5 hover:bg-indigo-600/50 border border-white/10 text-xs font-medium text-left">
                  ${t}
                </button>
              `).join('')}
            </div>
          </div>
        `;
      }
      // Slide 12: Phone redesign
      else if (slide === 12) {
        interactionZone.innerHTML = `
          <div class="space-y-3">
            <p class="text-xs font-semibold text-slate-200">${trans.prompt || 'Propose actionable friction measures:'}</p>
            <div class="flex gap-2">
              <input id="phoneIdeaInput" type="text" placeholder="e.g. Grayscale display, phone stationed in hall..." class="flex-1 px-3 py-2 text-xs rounded-lg bg-black/40 border border-white/20 text-white focus:outline-none focus:ring-1 focus:ring-indigo-400" />
              <button onclick="submitPhoneIdea()" class="px-4 py-2 text-xs font-bold rounded-lg bg-indigo-600 hover:bg-indigo-500 text-white">Post</button>
            </div>
            <div class="flex flex-wrap gap-1.5 pt-1">
              ${['Grayscale display', 'Remove short-form video apps', 'Charge outside sleeping area', 'Disable all non-human notifications', 'Desktop-only browser access'].map(quick => `
                <button onclick="document.getElementById('phoneIdeaInput').value='${quick}'; submitPhoneIdea();" class="px-2.5 py-1 text-[11px] rounded bg-white/5 border border-white/10 hover:bg-white/10 text-slate-300">
                  + ${quick}
                </button>
              `).join('')}
            </div>
          </div>
        `;
      }
      // Slide 13: 7-day experiment
      else if (slide === 13) {
        const levels = [
          'Level 1: Reduce (under 60 min/day, no short-form)',
          'Level 2: Remove (apps deleted, desktop browser only)',
          'Level 3: Full Pause (7 days total social pause)'
        ];
        const outcomes = ['Better sleep', 'Better concentration', 'Better mood', 'More initial boredom', 'More discretionary time', 'No noticeable difference', 'Harder than anticipated'];
        interactionZone.innerHTML = `
          <div class="space-y-4">
            <div>
              <p class="text-xs font-semibold text-slate-200 mb-2">1. Select protocol tier:</p>
              <div class="space-y-1.5">
                ${levels.map(l => `
                  <button onclick="voteExperimentLevel('${l}')" class="w-full text-left p-2.5 rounded-lg bg-white/5 hover:bg-indigo-600/50 border border-white/10 text-xs font-medium">
                    ${l}
                  </button>
                `).join('')}
              </div>
            </div>
            <div class="pt-3 border-t border-white/10">
              <p class="text-xs font-semibold text-slate-200 mb-2">2. Hypothesized primary outcome:</p>
              <div class="grid grid-cols-2 gap-1.5">
                ${outcomes.map(o => `
                  <button onclick="voteExperimentOutcome('${o}')" class="p-2 rounded-lg bg-white/5 hover:bg-indigo-600/50 border border-white/10 text-xs font-medium text-left">
                    ${o}
                  </button>
                `).join('')}
              </div>
            </div>
          </div>
        `;
      }
      // Slide 14: Implementation Intentions
      else if (slide === 14) {
        interactionZone.innerHTML = `
          <div class="space-y-3">
            <p class="text-xs font-semibold text-slate-200 leading-snug">Define conditional rule (Gollwitzer implementation intention):</p>
            <div class="space-y-2">
              <div>
                <label class="block text-[10px] font-mono text-indigo-300 font-bold uppercase mb-1">IF (Situational Trigger):</label>
                <input id="ifTriggerInput" type="text" placeholder="e.g. I sit down to study / I enter bed" class="w-full px-3 py-2 text-xs rounded-lg bg-black/40 border border-white/20 text-white focus:ring-1 focus:ring-indigo-400" />
              </div>
              <div>
                <label class="block text-[10px] font-mono text-emerald-300 font-bold uppercase mb-1">THEN I will (Pre-committed Response):</label>
                <input id="thenActionInput" type="text" placeholder="e.g. Leave device in drawer / plug in across the room" class="w-full px-3 py-2 text-xs rounded-lg bg-black/40 border border-white/20 text-white focus:ring-1 focus:ring-emerald-400" />
              </div>
              <button onclick="submitIfThenRule()" class="w-full py-2.5 mt-2 bg-indigo-600 hover:bg-indigo-500 rounded-lg font-bold text-xs text-white">Record Protocol</button>
            </div>
          </div>
        `;
      }
      // Slide 15: Final reflections
      else if (slide === 15) {
        interactionZone.innerHTML = `
          <div class="space-y-3">
            <p class="text-xs font-semibold text-slate-200">Personal focus for the 7-day protocol:</p>
            <textarea id="finalReflectionInput" rows="2" placeholder="Record key intention or focus area..." class="w-full px-3 py-2 text-xs rounded-lg bg-black/40 border border-white/20 text-white focus:ring-1 focus:ring-indigo-400"></textarea>
            <button onclick="submitReflection()" class="w-full py-2.5 bg-indigo-600 hover:bg-indigo-500 rounded-lg font-bold text-xs text-white">Submit Reflection</button>
          </div>
        `;
      }
    }

    // Handlers
    window.voteApp = (app) => { socket.emit('submitAppGuess', app); showToast(); };
    window.voteAccuracy = (acc) => { socket.emit('submitAccuracy', acc); showToast(); };
    window.voteScreenTime = (val) => { socket.emit('submitScreenTime', val); showToast(); };
    window.submitTextWorth = (val) => { socket.emit('submitTimeWorth', val); showToast(); };
    window.submitCustomWorth = () => {
      const val = document.getElementById('timeWorthInput').value;
      if (val) { socket.emit('submitTimeWorth', val); document.getElementById('timeWorthInput').value = ''; showToast(); }
    };
    window.voteEvidenceMetric = (m) => { socket.emit('submitEvidenceMetric', m); showToast(); };
    window.voteStudyType = (s) => { socket.emit('submitStudyType', s); showToast(); };
    window.voteTimeGo = (cat) => { socket.emit('submitTimeGo', cat); showToast(); };
    window.voteTrigger = (t) => { socket.emit('submitTrigger', t); showToast(); };
    window.submitPhoneIdea = () => {
      const val = document.getElementById('phoneIdeaInput').value;
      if (val) { socket.emit('submitPhoneIdea', val); document.getElementById('phoneIdeaInput').value = ''; showToast(); }
    };
    window.voteExperimentLevel = (lvl) => { socket.emit('submitExperimentLevel', lvl); showToast(); };
    window.voteExperimentOutcome = (outc) => { socket.emit('submitExperimentOutcome', outc); showToast(); };
    window.submitIfThenRule = () => {
      const trig = document.getElementById('ifTriggerInput').value;
      const resp = document.getElementById('thenActionInput').value;
      if (trig && resp) {
        socket.emit('submitIfThen', { trigger: trig, response: resp });
        document.getElementById('ifTriggerInput').value = '';
        document.getElementById('thenActionInput').value = '';
        showToast('Rule recorded');
      }
    };
    window.submitReflection = () => {
      const val = document.getElementById('finalReflectionInput').value;
      if (val) { socket.emit('submitReflection', val); document.getElementById('finalReflectionInput').value = ''; showToast('Reflection recorded'); }
    };
  </script>
</body>
</html>
